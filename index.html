<title>健康紀錄</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --card:#fff; --text:#1a1a19; --muted:#6b6a65; --accent:#2a73d0; --err:#c94040; --border:rgba(0,0,0,.12); }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d0d0d; --card:#1a1a19; --text:#fff; --muted:#a3a29b; --accent:#3987e5; --err:#e66767; --border:rgba(255,255,255,.12); } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"PingFang TC","Segoe UI",sans-serif; padding:0 16px; }
  form { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px 20px; width:100%; max-width:340px; }
  h1 { font-size:18px; margin:0 0 16px; }
  input[type=password] { width:100%; box-sizing:border-box; font-size:16px; padding:11px 12px; border-radius:9px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  label { display:flex; gap:8px; align-items:center; font-size:14px; color:var(--muted); margin:12px 0 16px; }
  button { width:100%; font-size:16px; padding:11px; border:0; border-radius:9px; background:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.6; }
  .msg { min-height:20px; font-size:13px; margin-top:10px; color:var(--err); }
</style></head>

<form id="f" autocomplete="on">

  <input type="password" id="pw" autocomplete="current-password" placeholder="密碼" required>
  <label><input type="checkbox" id="rm" checked> 記住此裝置 30 天</label>

  <div class="msg" id="msg"></div>
</form>

async function derive(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', hash:'SHA-256', salt:b64(P.s), iterations:P.n }, base, 256));
}
async function open(raw) {
  const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(P.i) }, key, b64(P.c));
  const html = new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
// 記住的裝置：頁面載入完成後自動解開（不在解析途中 document.open，避免版面錯位）
addEventListener('load', async () => {
  let saved = null;
  try { saved = JSON.parse(store.get(RK) || 'null'); } catch(e) {}
  if (saved && saved.exp > Date.now()) {
    try { await open(b64(saved.k)); return; } catch(e) { store.del(RK); }
  } else if (saved) store.del(RK);
});
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('go'), msg = document.getElementById('msg');
  btn.disabled = true; msg.textContent = ''; btn.textContent = '解密中…';
  const remember = document.getElementById('rm').checked;
  try {
    const raw = await derive(document.getElementById('pw').value);
    await open(raw);
    if (remember) store.set(RK, JSON.stringify({ k: btoa(String.fromCharCode(...raw)), exp: Date.now() + DAYS * 864e5 }));
  } catch(err) {
    btn.disabled = false; btn.textContent = '開啟'; msg.textContent = '密碼錯誤，請再試一次';
  }
});
